# schemas.yml — single source of truth for data shapes in this app.
# This is a static client-side app; there is no database. The "schemas" here
# are the JSON data files shipped with the build and the localStorage state.

# ---------------------------------------------------------------------------
# src/data/questions.json  — the full NCVEC Technician question pool (409 Qs)
# Generated by scripts/parse_pool.py. Do not hand-edit; re-run the parser.
# ---------------------------------------------------------------------------
questions:
  description: Array of question objects, one per pool question.
  item:
    id:          "string  e.g. 'T1A01' — subelement+group+number, unique"
    subelement:  "string  e.g. 'T1'"
    group:       "string  e.g. 'T1A'"
    correct:     "string  one of 'A' | 'B' | 'C' | 'D'"
    fccRef:      "string | null  FCC Part 97 rule reference, e.g. '97.1'"
    figure:      "string | null  e.g. 'T-1' when the question references a schematic"
    question:    "string  the question prompt (errata corrections applied)"
    choices:     "string[4]  answer choices in A,B,C,D order"
    explanation: "string (optional)  merged at load time from explanations.json"

# ---------------------------------------------------------------------------
# src/data/explanations.json  — original 1-2 sentence explanations per question
# Generated by scripts/gen_explanations.py (Claude via the local `claude` CLI),
# grounded in FCC Part 97 (public domain) for regulatory questions. Original
# text — NOT derived from any copyrighted study guide. Resumable/regenerable.
# ---------------------------------------------------------------------------
explanations:
  description: "map of questionId -> explanation string; merged onto questions[].explanation"

# ---------------------------------------------------------------------------
# src/data/syllabus.json  — subelement metadata + exam weighting
# Generated by scripts/parse_pool.py.
# ---------------------------------------------------------------------------
syllabus:
  description: Array of subelement objects (T0..T9). Drives exam composition and mastery view.
  item:
    code:          "string  e.g. 'T1'"
    name:          "string  human-readable, e.g. 'Commission's Rules'"
    examQuestions: "int     number of questions drawn from this subelement on a 35-Q exam"
    groups:        "int     number of lettered groups in this subelement"
    questionCount: "int     total pool questions in this subelement"
    groupCodes:    "string[]  e.g. ['T1A','T1B',...]"
  invariant: "sum(examQuestions) == 35"

# ---------------------------------------------------------------------------
# public/figures/  — schematic images referenced by figure questions
# ---------------------------------------------------------------------------
figures:
  files: [ "T-1.png", "T-2.png", "T-3.png" ]
  note: "referenced from questions[].figure; extracted from the release PDF"

# ---------------------------------------------------------------------------
# localStorage — per-device study progress (v1 has no backend).
# Accessed only through the ProgressStore interface (src/lib/progress).
# ---------------------------------------------------------------------------
localStorage:
  key: "ham-technician-progress-v1"
  shape:
    questions:
      description: "map of questionId -> per-question stats"
      value:
        seen:         "int   times the question has been viewed/answered"
        correct:      "int   times answered correctly"
        incorrect:    "int   times answered incorrectly"
        flagged:      "bool  user flagged for review"
        lastAnswered: "int | null  epoch ms"
        box:          "int   Leitner/SRS box (0 = new/lapsed; higher = longer interval)"
        due:          "int | null  epoch ms when next due for SRS review"
    exams:
      description: "array of completed practice-exam results"
      item:
        date:    "int   epoch ms"
        score:   "int   number correct out of total"
        total:   "int   number of questions (35)"
        passed:  "bool  score/total >= 0.74"

# ---------------------------------------------------------------------------
# Firestore (optional cross-device sync) — collection `progress`, one doc per user
# Doc id = Firebase Auth uid. Access restricted to the owner (firestore.rules).
# ---------------------------------------------------------------------------
firestore_progress:
  path: "progress/{uid}"
  shape:
    questions: "same map as localStorage.questions above"
    exams:     "same array as localStorage.exams above"
    updatedAt: "int   epoch ms of last server write"
  note: "Mirror of the localStorage ProgressState blob; merged with local on sign-in."
